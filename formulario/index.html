<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Prática 3 - Formulário Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Desafio: Formulário Interativo</h1>
            <p>Desenvolvimento Front End - Prof. Jean Holguim</p>
        </header>

        <form id="meuFormulario" novalidate>
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome..." required>
                <span class="error-message" id="nomeErro">O nome é obrigatório.</span>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
                <span class="error-message" id="emailErro">Insira um e-mail válido.</span>
            </div>

            <button type="submit" id="btnEnviar">Enviar Formulário</button>
        </form>
        
        <div id="feedbackSucesso" class="hidden">
            ✅ Formulário enviado com sucesso!
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
